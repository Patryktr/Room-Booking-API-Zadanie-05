name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: room_booking
          POSTGRES_PASSWORD: room_booking_test
          POSTGRES_DB: room_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room_booking -d room_booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://room_booking:room_booking_test@127.0.0.1:5432/room_booking_test
      JWT_SECRET: ci-jwt-secret-that-is-longer-than-thirty-two-characters
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: admin-test-password
      DEMO_USER_PASSWORD: user-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build .
